[platformio]
default_envs = sensor-shield

[env:sensor-shield]
; Arduino-ESP32 3.3.7, matching the original Arduino IDE installation.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
extra_scripts =
    pre:scripts/select_usb.py
    post:scripts/no_stub_upload.py

; Waveshare ESP32-S3-DEV-KIT-N8R8: use all 8 MB QIO flash. The firmware does
; not need the fitted 8 MB OPI PSRAM, so keep it disabled as in Arduino IDE.
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_qspi
board_upload.flash_size = 8MB
board_upload.maximum_size = 3342336
board_build.partitions = partitions.csv

; Remove base-board USB defaults before selecting TinyUSB.
build_unflags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_EVENT_RUNNING_CORE=1
    -DBOARD_HAS_PSRAM
build_flags =
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MSC_ON_BOOT=0
    -DARDUINO_USB_DFU_ON_BOOT=0
    -DARDUINO_RUNNING_CORE=1
    -DARDUINO_EVENT_RUNNING_CORE=0
    -DCORE_DEBUG_LEVEL=0

lib_deps =
    bblanchon/ArduinoJson@7.4.2
    pololu/VL53L0X@1.3.1

upload_protocol = esptool
upload_speed = 115200
; TinyUSB must reboot into the ROM loader; macOS may assign a new port.
board_upload.use_1200bps_touch = yes
board_upload.wait_for_upload_port = yes
; The CH343 connection on this board can corrupt the optional RAM stub.
; Write through the ESP32-S3 ROM bootloader for reliable workshop uploads.
upload_flags =
    --no-stub
monitor_speed = 115200
monitor_dtr = 1
monitor_rts = 0
monitor_filters = send_on_enter
; Select the actual device locally; never commit a machine-specific port.
; upload_port = COM5
; monitor_port = COM5

; Same hardware/build settings; opt-in lifecycle and measurement diagnostics.
[env:sensor-shield-diagnostics]
extends = env:sensor-shield
build_flags =
    ${env:sensor-shield.build_flags}
    -DILAB_VL53_DIAGNOSTICS=1

; Opt-in rate/config commands and per-frame timing; test settings stay in RAM.
[env:sensor-shield-stress]
extends = env:sensor-shield
build_flags =
    ${env:sensor-shield.build_flags}
    -DILAB_STRESS_TEST=1
