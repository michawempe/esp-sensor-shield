<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Default Test</title>
</head>
<body>
  <div>button1: <span id="v-button1">-</span></div>
  <div>slider1: <span id="v-slider1">-</span></div>
  <div>distance1: <span id="v-distance1">-</span></div>
  <div>joystick1: <span id="v-joystick1">-</span></div>
  <div>touch1: <span id="v-touch1">-</span></div>

  <script src="config/js/shared-core.js"></script>
  <script src="config/js/shared-serial.js"></script>
  <script src="config/js/shared-presets.js"></script>
  <script type="module" src="config/js/index-app.js"></script>
  <script>
    const ids = ["button1", "slider1", "distance1", "joystick1", "touch1"];

    function fmt(v) {
      if (v === undefined) return "-";
      if (v !== null && typeof v === "object") return JSON.stringify(v);
      return String(v);
    }

    function renderValues() {
      if (typeof window.getValue !== "function") return;
      for (const id of ids) {
        const el = document.getElementById(`v-${id}`);
        if (!el) continue;
        el.textContent = fmt(window.getValue(id, "-"));
      }
    }

    window.addEventListener("sensor-frame", renderValues);
    renderValues();
  </script>
</body>
</html>
