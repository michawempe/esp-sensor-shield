<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Frontend</title>
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <div id="circle" style="border-radius:999px;background:black;"></div>

  <script type="module">
    import { readSerialAndUpdate } from "./js/render.js";

    const circle = document.getElementById("circle");

    readSerialAndUpdate((sensors) => {
      const sliderdata = sensors.slider1.value;
      // mit Fallback sonst erster Wert undefined:
      // const sliderdata = sensors.slider1?.value ?? 0;
      const size = `${sliderdata * 100}px`
      circle.style.width = size;
      circle.style.height = size;
    }, { immediate: true });
  </script>

</body>
</html>
